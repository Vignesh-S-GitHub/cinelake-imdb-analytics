[project]
name = "cinelake"
version = "0.1.0"
description = "Movie & TV Analytics Lakehouse Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deltalake==1.4.1",
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "plotly>=6.8.0",
    "polars>=1.42.0",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "streamlit>=1.58.0",
    "typer>=0.26.7",
]

[tool.setuptools.packages.find]
include = ["cinelake*"]

[project.scripts]
cinelake = "cinelake.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.19",
]
